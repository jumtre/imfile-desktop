allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - postcss
  - axios@1.19.0

overrides:
  punycode: 2.3.1
  # CVE: host confusion via literal backslash authority delimiter (fixed in 3.1.4)
  fast-uri: ^3.1.4
